server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/png;
    gzip_min_length 1024;

    # SPA 라우팅 — 알 수 없는 경로는 index.html 로 넘김
    # index.html 은 매번 재검증 — Cache-Control 이 없으면 브라우저가 휴리스틱으로 캐시해
    # 배포 후에도 옛 번들(해시 파일명)을 계속 불러온다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 해시된 정적 자산 — 1년 캐시
    location ~* \.(js|css|png|ico|otf|woff|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
